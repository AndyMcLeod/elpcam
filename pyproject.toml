[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elpcam"
version = "1.0.0"
description = "Python engine and browser GUI for the ELP-USB500W05G-BL170 5MP fisheye USB camera (UVC)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andy McLeod" }]
requires-python = ">=3.10"
keywords = ["ELP", "USB camera", "UVC", "webcam", "fisheye", "dewarp", "OpenCV", "DirectShow", "V4L2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Multimedia :: Video :: Capture",
  "Framework :: FastAPI",
]
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "comtypes>=1.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
elpcam = "elpcam.__main__:main"

[project.urls]
Homepage = "https://github.com/amcleodUNH/elpcam"
Documentation = "https://github.com/amcleodUNH/elpcam/blob/main/docs/CAMERA.md"

[tool.setuptools]
packages = ["elpcam", "elpcam.controls"]

[tool.setuptools.package-data]
elpcam = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
